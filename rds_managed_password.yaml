metadata:
  id: "CKV2_ORG_3"
  name: "RDS must use a Secrets Manager managed password, not a literal one"
  category: "SECRETS"
  severity: "CRITICAL"
definition:
  and:
    - cond_type: attribute
      resource_types: [aws_db_instance]
      attribute: password
      operator: not_exists
    - cond_type: attribute
      resource_types: [aws_db_instance]
      attribute: manage_master_user_password
      operator: equals
      value: true
